name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (phpcs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
      - run: composer lint

  analyse:
    name: Static analysis (phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
      - run: composer analyse

  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - uses: ramsey/composer-install@v3
      - run: composer test:unit

  plugin-check:
    name: Plugin Check (org zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer
      - name: Build the WordPress.org flavour
        run: bin/build-zip.sh org
      - name: Unpack the zip
        run: |
          mkdir -p build-check
          unzip -q dist/bot-insight-org.zip -d build-check
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: build-check/bot-insight
